<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/img/impostazioni/LogoContainer.png" />
    </div>

    <nav class="side-nav" aria-label="Navigazione principale">
      <button type="button" aria-label="Dashboard">
        <img src="/img/impostazioni/Sidebar-item.png" />
      </button>
      <button type="button" aria-label="Organizzazione">
        <img src="/img/impostazioni/Sidebar-item-1.png" />
      </button>
      <button type="button" aria-label="Progetti">
        <img src="/img/impostazioni/Sidebar-item-2.png" />
      </button>
      <button type="button" aria-label="Statistiche">
        <img src="/img/impostazioni/Sidebar-item-3.png" />
      </button>
    </nav>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <div class="page-title">
        <span>{{ titoloPagina }}</span>
        <span class="info-icon" aria-label="Informazioni">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M12 11v5 M12 7.5h.01"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>

      <div class="top-actions">
        <button type="button" aria-label="Notifiche">
          <img src="/img/icone/icone-sidebar.png" />
        </button>
        <button type="button" aria-label="Configurazione" routerLink="/impostazioni">
          <img src="/img/icone/icone-sidebar-1.png" />
        </button>
        <div class="avatar" aria-label="Profilo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M5 20.5c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </header>
    <ng-content></ng-content>
  </main>
</div>
