
<app-side-bar [titoloPagina]="'Profilo'"></app-side-bar>
<div class="profile-banner">

  <div class="profile-info">
    <div class="profile-avatar">
      MR
    </div>

    <div class="profile-text">
      <h2>{{ nomeUtente }}</h2>
      <p>{{ ruoloUtente }}</p>
    </div>
  </div>
  
  <img src="/img/icone/Group 1171275896.png" class="banner-logo">
</div>

<!-- Sezione dati personali -->
<div class="personal-data">

  <!-- Intestazione -->
  <div class="personal-data-header">
    <h3>Dati personali</h3>

    <p class="change-password">
      ✎ Modifica password
    </p>
  </div>

  <!-- Riquadri dei dati -->
  <div class="personal-data-content">

    <div class="data-card">
      <span class="data-label"><img src="/img/icone/icona_utente.png">Ruolo</span>
      <span class="data-value">Utente</span>
    </div>

    <div class="data-card">
      <span class="data-label"><img src="/img/icone/icona_calendario.png">Data di assunzione</span>
      <span class="data-value">01/10/2025</span>
    </div>

    <div class="data-card">
      <span class="data-label"><img src="/img/icone/icona_email.png">Email</span>
      <span class="data-value">email@example.com</span>
    </div>

  </div>

</div>
